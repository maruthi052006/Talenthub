<style>
   .unique-btn {
    background: linear-gradient(45deg, rgb(137, 168, 178), rgb(179, 200, 207));
    color: #fff;
    border: 2px solid transparent;
    border-radius: 10px;
    padding: 15px 30px;
    font-size: 16px;
    font-weight: bold;
    position: relative;
    overflow: hidden;
    transition: transform 0.3s, background 0.3s ease, box-shadow 0.3s;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
}

.unique-btn:before {
    content: '';
    position: absolute;
    top: -150%;
    left: -150%;
    width: 300%;
    height: 300%;
    background: rgba(255, 255, 255, 0.2);
    transform: rotate(45deg);
    transition: all 0.5s ease;
}

.unique-btn:hover {
    background: linear-gradient(45deg, rgb(179, 200, 207), rgb(137, 168, 178));
    transform: scale(1.05);
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
