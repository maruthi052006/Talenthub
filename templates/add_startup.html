<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Startup</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background: url('https://via.placeholder.com/1920x1080') no-repeat center center fixed;
            background-size: cover;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
        }

        .form-container {
            background-color: rgba(255, 255, 255, 0.9);
            box-shadow: 0 8px 10px rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            padding: 30px;
            width: 100%;
            max-width: 420px;
        }

        .form-container h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        .btn {
            background: linear-gradient(to right, #6a11cb, #2575fc);
            border: none;
            color: #fff;
            font-weight: bold;
        }

        .btn:hover {
            background: linear-gradient(to right, #2575fc, #6a11cb);
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Add Startup</h2>
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="mb-3">
                <label for="company_name" class="form-label">Company Name:</label>
                <input type="text" name="company_name" id="company_name" class="form-control" placeholder="Enter company name" required>
            </div>

            <div class="mb-3">
                <label for="logo" class="form-label">Company Logo:</label>
                <input type="file" name="logo" id="logo" class="form-control">
                <small class="text-muted">Upload a logo in PNG or JPG format.</small>
            </div>

            <div class="mb-3">
                <label for="founder_name" class="form-label">Founder Name:</label>
                <input type="text" name="founder_name" id="founder_name" class="form-control" placeholder="Enter founder's name" required>
            </div>

            <div class="mb-3">
                <label for="founder_profile_pic" class="form-label">Founder Profile Picture:</label>
                <input type="file" name="founder_profile_pic" id="founder_profile_pic" class="form-control">
                <small class="text-muted">Upload a profile picture in PNG or JPG format.</small>
            </div>

            <div class="mb-3">
                <label for="types_of_company" class="form-label">Type of Company:</label>
                <input type="text" name="types_of_company" id="types_of_company" class="form-control" placeholder="Enter type of company" required>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email:</label>
                <input type="email" name="email" id="email" class="form-control" placeholder="Enter company email" required>
            </div>

            <div class="mb-3">
                <label for="phone" class="form-label">Phone:</label>
                <input type="text" name="phone" id="phone" class="form-control" placeholder="Enter phone number" required>
            </div>

            <div class="mb-3">
                <label for="role_of_company" class="form-label">Role of the Company:</label>
                <input type="text" name="role_of_company" id="role_of_company" class="form-control" placeholder="Enter company's role" required>
            </div>

            <button type="submit" class="btn btn-primary w-100">Add Startup</button>
        </form>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
