{% extends 'base.html' %}
{% block content %}
{% load static %}
<div class="container my-4">
    <!-- Title and Club Count -->
    <div class="row justify-content-center mb-4">
        <div class="col-auto text-center">
            <button class="btn mt-2" style="background-color: rgb(137, 168, 178);">
                Total Clubs&nbsp;&nbsp;&nbsp;
                <span class="badge bg-danger p-1">{{ clubs.count }}</span>
            </button>
        </div>
    </div>

    <!-- Responsive Club Grid -->
    <div class="row">
        {% for club in clubs %}
        <div class="col-12 col-md-6 col-lg-4 mb-4">
            <!-- Horizontal Club Card -->
            <div class="card shadow-sm p-3 d-flex align-items-center flex-row">
                <!-- Club Logo -->
                {% if club.logo %}
                <img src="{{ club.logo.url }}" class="rounded-circle me-3 border border-dark"
                    style="width: 80px; height: 80px; object-fit: cover;" alt="{{ club.name }} Logo">
                {% else %}
                <img src="{% static 'img/default.jpg' %}" class="rounded-circle me-3 border border-dark"
                    style="width: 80px; height: 80px; object-fit: cover;" alt="Default Club Logo">
                {% endif %}

                <!-- Club Details -->
                <div class="flex-grow-1">
                    <h5 class="mb-1">{{ club.name }}</h5>
                    <p class="text-muted mb-1">Head: {{ club.head }}</p>
                    <p class="text-muted mb-1">Email: <a href="mailto:{{ club.email }}">{{ club.email }}</a></p>
                </div>

                <!-- View Details Button -->
                <!-- <button class="btn btn-outline-primary btn-sm" {% comment %}
                    onclick="window.location.href='{% url 'club_detail' club.id %}'"> {% endcomment %}
                    <i class="bi bi-eye"></i> View Details
                </button> -->
            </div>
        </div>
        {% empty %}
        <div class="col-12">
            <p class="text-center text-muted">No clubs found.</p>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock content %}
